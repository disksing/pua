<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>PUA</title>
    <link rel="icon" type="image/png" href="/workspace-icons/pua-yellow-opaque.png" />
    <link rel="stylesheet" href="/assets/pua-app.css" />
    <link rel="stylesheet" href="/vendor/diff2html/diff2html.min.css" />
  </head>
  <body>
    <script>
      // Apply the persisted theme before first paint to avoid flashing the
      // default theme. Must stay in sync with the registry in
      // web/src/controllers/theme-controller.ts; an unknown id simply matches
      // no override rules and falls back to the default appearance.
      try {
        var storedTheme = localStorage.getItem("pua.web.themePreference");
        document.documentElement.dataset.theme = /^[a-z0-9-]+$/.test(storedTheme || "") ? storedTheme : "default";
      } catch (_) {
        document.documentElement.dataset.theme = "default";
      }
    </script>
    <div id="app"></div>
    <script src="/vendor/lucide/lucide.min.js"></script>
    <script src="/vendor/diff2html/diff2html.min.js"></script>
    <script src="/vendor/dompurify/purify.min.js"></script>
    <script src="/vendor/marked/marked.min.js"></script>
    <script type="module" src="/assets/pua-app.js"></script>
  </body>
</html>
