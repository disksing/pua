name: Release credentials preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: scripts/ci-import-certificate
      - name: Configure notarization credentials
        env:
          NOTARYTOOL_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARYTOOL_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NOTARYTOOL_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: scripts/ci-configure-notary
      - name: Verify signing, notarization and update keys
        shell: bash
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          COMPONENT_UPDATE_PUBLIC_KEY: ${{ secrets.COMPONENT_UPDATE_PUBLIC_KEY }}
          COMPONENT_MANIFEST_PRIVATE_KEY: ${{ secrets.COMPONENT_MANIFEST_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          keychain=$(cat "$RUNNER_TEMP/pua-signing-keychain-path")
          security find-identity -v -p codesigning "$keychain" |
            grep -Fq "\"$CODESIGN_IDENTITY\""
          xcrun notarytool history \
            --keychain-profile "$NOTARYTOOL_KEYCHAIN_PROFILE" \
            --keychain "$NOTARYTOOL_KEYCHAIN" \
            --output-format json >/dev/null
          [ "$(printf %s "$COMPONENT_UPDATE_PUBLIC_KEY" | base64 -D | wc -c | tr -d ' ')" = 32 ]
          [ "$(printf %s "$COMPONENT_MANIFEST_PRIVATE_KEY" | base64 -D | wc -c | tr -d ' ')" = 64 ]
          cmp -s \
            <(printf %s "$COMPONENT_UPDATE_PUBLIC_KEY" | base64 -D) \
            <(printf %s "$COMPONENT_MANIFEST_PRIVATE_KEY" | base64 -D | tail -c 32)
          echo "Release credentials are valid"
